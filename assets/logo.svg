<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="astro-vex logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)" rx="20"/>

  <g opacity="0.2" fill="#ffffff">
    <circle cx="80" cy="90" r="2"/><circle cx="130" cy="230" r="1.5"/>
    <circle cx="240" cy="70" r="1.2"/><circle cx="310" cy="300" r="1.6"/>
    <circle cx="430" cy="120" r="1.8"/><circle cx="560" cy="60" r="1.4"/>
    <circle cx="670" cy="280" r="1.6"/><circle cx="810" cy="90" r="1.3"/>
    <circle cx="900" cy="240" r="1.8"/><circle cx="1080" cy="110" r="1.5"/>
  </g>

  <g transform="translate(120,180)">
    <polygon points="-26,28 0,-34 26,28" fill="none" stroke="#f8fafc" stroke-width="7"/>
    <line x1="0" y1="-34" x2="0" y2="-62" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
    <path d="M -8 -66 C -18 -84 18 -84 8 -66" fill="#22d3ee" filter="url(#glow)"/>
  </g>

  <g fill="#94a3b8" stroke="#e2e8f0" stroke-width="4">
    <polygon points="965,70 995,58 1030,70 1038,102 1010,124 978,114"/>
    <polygon points="1015,210 1048,200 1080,216 1070,250 1038,262 1012,242"/>
    <polygon points="900,255 924,246 950,260 945,286 920,295 898,279"/>
  </g>

  <g stroke="url(#neon)" stroke-width="8" stroke-linecap="round" filter="url(#glow)">
    <line x1="170" y1="168" x2="465" y2="168"/>
    <line x1="170" y1="188" x2="435" y2="188"/>
    <line x1="170" y1="208" x2="385" y2="208"/>
  </g>

  <text x="500" y="170" font-size="74" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#f8fafc">ASTRO</text>
  <text x="500" y="242" font-size="74" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="url(#neon)">VEX</text>

  <text x="500" y="290" font-size="22" font-family="Consolas, monospace" fill="#94a3b8">arcade shooter built with pygame</text>
</svg>
